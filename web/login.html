<!doctype html><html lang="ko" class="dantami-login"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>로그인 · Dantami Repo Sync</title><link rel="stylesheet" href="index.cgi?asset=login.css"><script defer src="index.cgi?asset=login.js"></script></head><body><main class="login-layout"><section class="intro"><div class="brand"><span class="mark">⇄</span> DANTAMI REPO SYNC</div><div class="intro-copy"><span class="eyebrow">YOUR CODE. IN SYNC.</span><h1>흩어진 코드를,<br>한곳에서 관리해요.</h1><p>GitHub와 Gitea를 연결하고<br>저장소의 변경을 안전하게 맞춰 보세요.</p><div class="routes" aria-hidden="true"><span>GitHub</span><i>⇄</i><span>Gitea</span></div></div><small>원본 저장소 보호 · 충돌 확인 · 자동 동기화</small></section><section class="entry"><div class="form-wrap"><span class="eyebrow">WELCOME BACK</span><h2>로그인</h2><p class="subtitle">이 앱에서 만든 계정으로 접속하세요</p><form id="loginForm"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="40" placeholder="앱 계정 아이디"><label for="password">비밀번호</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="비밀번호 입력"><button id="showPassword" type="button" aria-label="비밀번호 표시">보기</button></div><p id="loginError" role="alert"></p><button id="loginButton" class="submit" type="submit">로그인 <span>→</span></button></form><div class="help"><b>처음 사용하시나요?</b><p>패키지 설치·업데이트 화면에서 만든 관리자 계정을 사용하세요. DSM 계정과는 별개예요.</p></div><p class="security">보호된 연결 · 8시간 세션 · 비밀번호 해시 저장</p></div></section></main></body></html>
